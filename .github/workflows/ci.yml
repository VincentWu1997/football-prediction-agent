# W10 CI：Python 侧 ruff + pytest（DB 用例用 SKIP_DB_TESTS 跳过）+ Java 侧编译烟测
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev,ml,mcp,ui]"
      - name: ruff 检查
        run: ruff check .
      - name: pytest（无 DB/无 Ollama 环境）
        env:
          SKIP_DB_TESTS: "1"
        run: pytest -q

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Spring 服务编译 + 测试
        working-directory: spring-service
        run: mvn -q -DskipTests=false test
